<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTC Admin Login</title><link rel="stylesheet" href="{{url_for('static',filename='admin.css')}}"></head><body class="admin-body"><main class="login-card"><a class="admin-brand" href="/"><span>KTC</span><div><b>Kings Tourism Crest</b><small>Private admin area</small></div></a><p class="eyebrow">SECURE ACCESS</p><h1>Welcome<br><em>back.</em></h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Enter dashboard ↗</button></form><a class="back" href="/">← Back to website</a></main></body></html>
